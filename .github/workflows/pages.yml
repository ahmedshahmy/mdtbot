name: Deploy web app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow the deploy job to write a Pages deployment and mint an id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload the web app (medical-web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: medical-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
